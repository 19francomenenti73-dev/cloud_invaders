<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasori delle Nuvole - Nowcasting Italia</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            display: inline-block;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            max-width: 100%;
        }
        canvas {
            display: block;
            background: #000;
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        button {
            background: #111;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 6px;
            user-select: none;
            touch-action: manipulation;
        }
        button:active {
            background: #00ffcc;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="380" height="500"></canvas>
        <div class="controls">
            <button id="leftBtn">◀</button>
            <button id="fireBtn">FUOCO</button>
            <button id="rightBtn">▶</button>
        </div>
    </div>

    <script>
        // Web Audio API per i suoni retrò (zero file esterni)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let lives = 3;
        let level = 1;

        // Giocatore (Volontario 👷)
        let player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 45,
            width: 36,
            height: 36,
            speed: 6,
            dx: 0
        };

        let bullets = [];
        let enemyBullets = [];
        let clouds = [];

        function initClouds() {
            clouds = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 6; c++) {
                    clouds.push({
                        x: 35 + c * 52,
                        y: 45 + r * 38,
                        width: 32,
                        height: 24,
                        alive: true
                    });
                }
            }
        }
        initControlli = initClouds();

        let cloudDirection = 1;
        let cloudSpeed = 1;

        // Controlli Tastiera
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') player.dx = -player.speed;
            if (e.key === 'ArrowRight') player.dx = player.speed;
            if (e.key === ' ' || e.key === 'ArrowUp') shootBullet();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' && player.dx < 0) player.dx = 0;
            if (e.key === 'ArrowRight' && player.dx > 0) player.dx = 0;
        });

        // Controlli Touch / Mouse pulsanti
        const bindButton = (id, action) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); action(true); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); action(false); });
            btn.addEventListener('mousedown', () => action(true));
            btn.addEventListener('mouseup', () => action(false));
        };

        bindButton('leftBtn', (active) => player.dx = active ? -player.speed : 0);
        bindButton('rightBtn', (active) => player.dx = active ? player.speed : 0);
        
        document.getElementById('fireBtn').addEventListener('click', shootBullet);
        document.getElementById('fireBtn').addEventListener('touchstart', (e) => { e.preventDefault(); shootBullet(); });

        function shootBullet() {
            if (bullets.length < 3) {
                bullets.push({
                    x: player.x + player.width / 2 - 2,
                    y: player.y,
                    width: 4,
                    height: 12,
                    speed: 8
                });
                playSound('shoot');
            }
        }

        let enemyShootTimer = 0;

        function update() {
            // Movimento player
            player.x += player.dx;
            if (player.x < 5) player.x = 5;
            if (player.x + player.width > canvas.width - 5) player.x = canvas.width - player.width - 5;

            // Movimento proiettili laser
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Movimento proiettili nuvole (⚡)
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].y += enemyBullets[i].speed;
                // Collisione con il giocatore
                if (
                    enemyBullets[i].x < player.x + player.width &&
                    enemyBullets[i].x + enemyBullets[i].width > player.x &&
                    enemyBullets[i].y < player.y + player.height &&
                    enemyBullets[i].y + enemyBullets[i].height > player.y
                ) {
                    enemyBullets.splice(i, 1);
                    lives--;
                    playSound('explosion');
                    if (lives <= 0) {
                        alert("GAME OVER! Il temporale ha avuto la meglio.");
                        lives = 3;
                        score = 0;
                        cloudSpeed = 1;
                        initClouds();
                    }
                    continue;
                }
                if (enemyBullets[i].y > canvas.height) {
                    enemyBullets.splice(i, 1);
                }
            }

            // Movimento delle nuvole
            let hitEdge = false;
            clouds.forEach(cloud => {
                if (!cloud.alive) return;
                cloud.x += cloudSpeed * cloudDirection;
                if (cloud.x <= 10 || cloud.x + cloud.width >= canvas.width - 10) {
                    hitEdge = true;
                }
            });

            if (hitEdge) {
                cloudDirection *= -1;
                clouds.forEach(cloud => {
                    cloud.y += 10;
                });
            }

            // Spara fulmini casuali dalle nuvole
            enemyShootTimer++;
            if (enemyShootTimer > 35) {
                enemyShootTimer = 0;
                let aliveClouds = clouds.filter(c => c.alive);
                if (aliveClouds.length > 0) {
                    let shooter = aliveClouds[Math.floor(Math.random() * aliveClouds.length)];
                    enemyBullets.push({
                        x: shooter.x + shooter.width / 2 - 4,
                        y: shooter.y + shooter.height,
                        width: 8,
                        height: 14,
                        speed: 3.5
                    });
                }
            }

            // Collisioni proiettile -> nuvola
            for (let b = bullets.length - 1; b >= 0; b--) {
                for (let c = 0; c < clouds.length; c++) {
                    let cloud = clouds[c];
                    if (cloud.alive &&
                        bullets[b].x < cloud.x + cloud.width &&
                        bullets[b].x + bullets[b].width > cloud.x &&
                        bullets[b].y < cloud.y + cloud.height &&
                        bullets[b].y + bullets[b].height > cloud.y
                    ) {
                        cloud.alive = false;
                        bullets.splice(b, 1);
                        score += 100;
                        playSound('explosion');
                        break;
                    }
                }
            }

            // Vittoria livello
            if (clouds.every(c => !c.alive)) {
                level++;
                cloudSpeed += 0.4;
                initClouds();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // HUD
            ctx.fillStyle = "#00ffcc";
            ctx.font = "13px 'Courier New'";
            ctx.fillText(`SCORE: ${score}`, 12, 22);
            ctx.fillText(`LIVES: ${'👷'.repeat(lives)}`, canvas.width - 110, 22);

            // Giocatore (👷)
            ctx.font = "28px Arial";
            ctx.fillText("👷", player.x + 2, player.y + 28);

            // Laser giocatore
            ctx.fillStyle = "#ff0055";
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // Fulmini nemici (⚡)
            ctx.font = "16px Arial";
            enemyBullets.forEach(eb => {
                ctx.fillText("⚡", eb.x - 4, eb.y + 12);
            });

            // Nuvole nemiche (☁️)
            ctx.font = "26px Arial";
            clouds.forEach(cloud => {
                if (cloud.alive) {
                    ctx.fillText("☁️", cloud.x - 4, cloud.y + 20);
                }
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initClouds();
        loop();
    </script>
</body>
</html>
